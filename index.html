<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Toolbox – Free Utilities for QA Engineers</title>
  <meta name="description" content="QA Toolbox – Free tools for QA engineers and developers: timestamp converter, JSON formatter, JWT decoder, regex tester, password, UUID and hash generators, URL/Base64 encoders, JSON ↔ CSV, fake data, deep links and cron reader.">
  <meta name="author" content="Huseyin Kesmez">
  <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Apply the saved / system theme before first paint to avoid a flash -->
  <script>
    (function () {
      var theme;
      try { theme = JSON.parse(localStorage.getItem('qa-toolbox:theme')); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-actions">
      <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button type="button" class="icon-btn" id="share-btn" aria-label="Share this page" title="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
      </button>
    </div>

    <h1 class="site-title"><span class="gradient-text">QA</span> Toolbox</h1>
    <p class="site-subtitle">Free Utilities for QA Engineers and Developers</p>
    <p class="site-author">Made by <a href="https://github.com/huseyinkesmez" target="_blank" rel="noopener">Huseyin Kesmez</a></p>
  </header>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="tool-search" class="sr-only">Search tools</label>
        <input type="search" id="tool-search" placeholder="Search tools… (e.g. jwt, csv, hash)" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div class="chips" id="category-chips" role="toolbar" aria-label="Filter by category"></div>
      <nav class="chips quick-nav" id="quick-nav" aria-label="Jump to tool"></nav>
    </div>
  </div>

  <main id="tools-container" aria-live="polite"></main>

  <footer class="site-footer">
    <p>QA Toolbox – Free developer utilities for QA engineers &amp; developers.</p>
    <p>Everything runs locally in your browser. Your last inputs are remembered on this device only.
      <button type="button" class="btn btn-secondary btn-sm" id="clear-storage">Clear saved data</button>
    </p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/lib/md5.js"></script>
  <script src="assets/js/lib/cron.js"></script>
  <script src="assets/js/tools.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
